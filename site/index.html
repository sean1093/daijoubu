<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隨身旅伴 TravelBuddy</title>
    <meta name="theme-color" content="#f4efe6" />
    <script>
      // Each country edition lives under its own path (./japan/, later others).
      // With one edition so far, go straight to it. The hash goes along, so a
      // link shared before the country paths existed (#/s/…) still opens with
      // its data, and a home-screen icon installed from the old root still works.
      (function () {
        var target = "./japan/" + location.hash;
        var go = function () {
          location.replace(target);
        };
        // Earlier versions registered a service worker at this root scope; drop
        // it so it stops serving the old app shell here.
        var sw = navigator.serviceWorker;
        var root = new URL("./", location.href).href;
        if (!sw) return go();
        setTimeout(go, 1500);
        sw.getRegistrations()
          .then(function (registrations) {
            return Promise.all(
              registrations
                .filter(function (registration) {
                  return registration.scope === root;
                })
                .map(function (registration) {
                  return registration.unregister();
                }),
            );
          })
          .then(go, go);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        font: 20px/1.6 "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
        background: #f4efe6;
        color: #2b2a27;
      }
      a {
        color: #3d4f7a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <p>正在開啟 <a href="./japan/">隨身旅伴・日本</a>…</p>
  </body>
</html>
